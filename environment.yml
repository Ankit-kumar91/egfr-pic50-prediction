name: egfr-env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11

  # Core data science
  - numpy>=2.0
  - pandas>=2.0
  - polars>=1.0
  - scipy>=1.11

  # Cheminformatics — rdkit must come from conda-forge
  - rdkit>=2023.09

  # Classical ML
  - scikit-learn>=1.3
  - xgboost>=2.0
  - lightgbm>=4.0

  # Deep learning — must come from conda-forge, not the `pytorch` channel:
  # pytorch-channel builds through 2.2.x were compiled against numpy 1.x and
  # silently break torch.from_numpy()/tensor.numpy() under numpy>=2, which
  # scikit-learn/scipy's conda-forge builds require. conda-forge's pytorch
  # builds are numpy2-compatible.
  - conda-forge::pytorch>=2.6

  # Visualization & chemical space
  - matplotlib>=3.7
  - seaborn>=0.12
  - umap-learn>=0.5
  - plotly>=5.17

  # Notebooks
  - jupyter
  - ipykernel
  - ipywidgets
  - anywidget

  # Utilities
  - tqdm
  - pyyaml
  - joblib

  # Dev tools
  - ruff>=0.4
  - pytest>=7.0

  - pip
  - pip:
    # PyTorch Geometric — GNNs from scratch
    # torch_scatter/sparse/cluster omitted: build-from-source fails on macOS.
    # torch_geometric>=2.4 is sufficient for GCN/GAT/MPNN without them.
    - torch_geometric>=2.4

    # Chemprop — D-MPNN benchmark (v2 API). >=2.2 required for
    # --from-foundation CHEMELEON fine-tuning.
    - chemprop>=2.2

    # ChEMBL data access
    - chembl_webresource_client>=0.10

    # Weights & Biases — experiment tracking & model registry
    - wandb>=0.17

    # SHAP — feature importance & atom-level attribution
    - shap>=0.44

    # Uncertainty quantification
    - mapie>=0.8

    # App
    - streamlit>=1.32
