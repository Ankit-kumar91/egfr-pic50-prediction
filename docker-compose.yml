# Local dual-service run: FastAPI backend + Streamlit UI talking to it.
# Usage:
#   docker-compose up          # both services
#   docker-compose up api      # backend only
#   docker-compose down

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: egfr-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: egfr-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
